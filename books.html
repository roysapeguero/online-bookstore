<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Book Nook | Online Bookstore</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <nav>
        <h1>The Book Nook</h1>

        <ul class="nav nav-tabs justify-content-end">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="books.html">Books</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="signup.html">Sign Up</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="cart.html">Cart</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <h2>Book Management</h2>

        <form id="bookForm">
          <label for="title">Title:</label>
          <input id="title" type="text" required />

          <label for="description">Description:</label>
          <textarea id="description" required></textarea>

          <label for="author">Author:</label>
          <input id="author" type="text" />

          <label for="category">Category:</label>
          <input id="category" type="text" required />

          <label for="format">Format:</label>
          <select id="format" required>
            <option value="">Select Format</option>
            <option value="Hardcover">Hardcover</option>
            <option value="Paperback">Paperback</option>
            <option value="Ebook">Ebook</option>
            <option value="Audiobook">Audiobook</option>
          </select>

          <label for="price">Price:</label>
          <input id="price" type="number" min="0" step="0.01" required />

          <button type="submit">Add Book</button>
          <p id="bookMessage"></p>
        </form>
      </section>

      <section>
        <h2>Book Inventory</h2>

        <label for="bookSearch">Search Books:</label>
        <input id="bookSearch" type="search" placeholder="Search books" />

        <table>
          <thead>
            <tr>
              <th>Book ID</th>
              <th>Title</th>
              <th>Description</th>
              <th>Author</th>
              <th>Category</th>
              <th>Format</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookTableBody"></tbody>
        </table>
      </section>

      <section>
        <h2>Book Data in JSON Format</h2>
        <pre id="bookJsonOutput"></pre>

        <button id="downloadBookJson" type="button">Download JSON File</button>
      </section>
    </main>
  </body>
</html>
