<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <title>The Book Nook | Online Bookstore</title>
  <script src="script.js"></script>
  <link rel="stylesheet" href="index.css" />

</head>

<body alt="signup">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <header>
    <nav>
      <h1>The Book Nook</h1>

      <ul class="nav nav-tabs justify-content-end">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="books.html">Books</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="signup.html">Sign Up</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="cart.html">Cart</a>
        </li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="signupSection" class="container justify-content-center my-4" style="max-width: 600px;">
      <h2 class="text-center py-4">Create an Account</h2>
      <p id="signText">Become a member of The Book Nook</p>

      <form id="signupForm" class="container my-4" style="max-width: 600px;">
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name:</label>
          <input type="text" class="form-control" id="fullName" name="fullName" required />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address:</label>
          <input type="email" class="form-control" id="email" name="email" required />
        </div>

        <div class="mb-3">
          <label for="age" class="form-label">Age:</label>
          <input type="number" class="form-control" id="age" name="age" min="1" required />
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Address:</label>
          <input type="text" class="form-control" id="address" name="address" required />
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Phone:</label>
          <input type="tel" class="form-control" id="phone" name="phone" />
        </div>

        <button type="submit">Sign Up</button>
        <div id="formMessage"></div>
      </form>
    </section>
    <footer>
      <h3>The Book Nook</h3>
      <p>IST 256 Group Project</p>
      <p>Created by: Jenna Eberly, Roysa Yvel Peguero Martinez, and Anas Mohamed Abdelgadir</p>
    </footer>
</body>

</html>
